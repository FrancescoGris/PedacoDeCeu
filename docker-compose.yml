version: "3.8"

services:

  database:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: pedacodoceu
      MYSQL_USER: my_user
      MYSQL_PASSWORD: user_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  backend:
    build:
      context: ./PedacodeCeu-Back
      dockerfile: Dockerfile
    container_name: pedaco-back
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: pedacodoceu
      DB_USER: my_user
      DB_PASS: user_password
    expose:
      - "3000"
    depends_on:
      - database
    networks:
      - app-network

  frontend:
    build:
      context: ./PedacodeCeu-Front
      dockerfile: Dockerfile
    container_name: pedaco-front
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network: