events {}

http {
  include /etc/nginx/mime.types;

  server {
    listen 80;
    server_name pedacodeceu.local;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name pedacodeceu.local;

    ssl_certificate /etc/nginx/certs/pedacodeceu.local.pem;
    ssl_certificate_key /etc/nginx/certs/pedacodeceu.local-key.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geoleration=()" always;

    location / {
      proxy_pass http://pedaco-front:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://pedaco-back:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}